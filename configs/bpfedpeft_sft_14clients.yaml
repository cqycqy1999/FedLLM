task: sft
output_dir: outputs/bpfedpeft_14clients
seed: 42

model:
  model_name_or_path: Qwen/Qwen3-0.6B
  tokenizer_name_or_path: Qwen/Qwen3-0.6B
  trust_remote_code: true
  torch_dtype: bfloat16
  use_flash_attn: false
  gradient_checkpointing: true

peft:
  method: lora
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

federated:
  algorithm: bpfedpeft
  num_clients: 14
  clients_per_round: 14
  rounds: 64
  local_epochs: 4
  local_steps: null
  sample_mode: uniform
  client_execution: thread
  fail_fast: true
  min_success_rate: 0.8

bpfedpeft:
  # Qwen3-0.6B has L=28 and uses three overlapping blocks in this setup.
  block_end_layers: [10, 19, 28]
  overlap_layers: 1
  vector_path: outputs/bpfedpeft_14clients/depth_vectors.pt
  anchoring_rounds_per_block: 1
  anchoring_local_epochs: 1
  min_local_steps: 1
  local_stability_threshold: 0.995
  min_rounds_per_block: 1
  max_rounds_per_block: 4
  global_stability_alpha: 0.6
  global_stability_delta: 1.0e-3
  use_block_forward: true

data:
  task: sft
  source: local
  # Generated by scripts/prepare_semantic_dirichlet.py.
  data_path: data/semantic_dirichlet_14clients
  file_type: jsonl
  partitioner: semantic_dirichlet
  partition_seed: 42
  dirichlet_alpha: 0.3
  semantic_label_field: semantic_label
  prompt_field: prompt
  response_field: response

eval:
  # Benchmarks: HumanEval pass@1, FinQA execution accuracy, MedQA-USMLE accuracy.
  # Keep eval_every at 0 for long training runs, then call the standalone evaluator,
  # or set eval_every > 0 to evaluate on the A100 server during training.
  eval_every: 0
  save_every: 0
  eval_requires_merged_model: false
  summary_primary_metric: eval/humaneval/pass_at_1
  tasks:
    - humaneval
    - finqa
    - medqa
  dataset_dir: assets/datasets
  humaneval_dataset: openai/openai_humaneval
  humaneval_split: test
  finqa_dataset: ChanceFocus/flare-finqa
  finqa_split: test
  medqa_dataset: bigbio/med_qa
  medqa_config: med_qa_en_4options_source
  medqa_split: test
  prompt_max_length: 512
  max_new_tokens: 256
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  humaneval_timeout: 3.0

sft:
  max_length: 512
  lr: 1.0e-4
  batch_size: 8
  grad_accum_steps: 1
  optimizer: adamw
